<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Fibonacci Series</title>
  </head>
  <body>
    <h1>Fibonacci Series</h1>
    <p>
      Please enter the number of fibonacci series characters you wish to see
    </p>

    <input type="number" id="fibNumber" placeholder="Enter a Number" />
    <button id="btn" disabled>Submit</button>

    <div id="hide">
      <h3>
        First <span class="numberUser">X</span> character of fibonacci series :
        <span id="series">XX</span>
      </h3>
    </div>

    <script src="app.js"></script>
  </body>
</html>

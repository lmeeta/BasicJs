<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>SumofnNaturalDigit</title>
  </head>
  <body>
    <h1>Sum of 'n' Natural Digit</h1>
    <p>Please enter the number to get sum of natural digit you wish to see</p>

    <input type="number" id="number" placeholder="Enter a Number" />
    <button id="btn" disabled>Submit</button>

    <div id="hide">
      <h3>
        Sum of <span class="numberUser">X</span> natural digit is :
        <span id="series">XX</span>
      </h3>
    </div>

    <script src="app.js"></script>
  </body>
</html>
